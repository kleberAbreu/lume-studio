# Incluir dentro do server HTTPS que já atende www.kleberabreu.com.br.
location = /img_editor {
    proxy_pass http://127.0.0.1:3137;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /img_editor/ {
    proxy_pass http://127.0.0.1:3137;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 21m;
    proxy_read_timeout 300s;
}
