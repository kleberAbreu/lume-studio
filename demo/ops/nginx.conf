location = /lume-demo { return 308 /lume-demo/; }
location ^~ /lume-demo/ {
    proxy_pass http://127.0.0.1:3141;
    proxy_http_version 1.1;
    proxy_set_header X-Lume-Demo-IP $remote_addr;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Lume-Key "";
    client_max_body_size 5500k;
    client_body_buffer_size 5500k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 200s;
    access_log off;
}
